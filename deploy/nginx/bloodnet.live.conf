server {
    listen 80;
    listen [::]:80;
    server_name bloodnet.live www.bloodnet.live;

    client_max_body_size 25M;
    error_page 503 /runtime-maintenance/notice.html;
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /runtime-maintenance/notice.html {
        internal;
        root /var/www/bloodnet/public;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # A scoped read-only progress token is validated by the independent helper.
    location ^~ /api/admin/recovery/progress/ {
        proxy_pass http://127.0.0.1:3219/progress/;
        proxy_set_header X-Recovery-Progress $http_x_recovery_progress;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 =503 /runtime-maintenance/notice.html;
    }
    location ^~ /private/console-0be5626d4305f192e37e/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if (-f /var/www/bloodnet/public/runtime-maintenance/enabled) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

