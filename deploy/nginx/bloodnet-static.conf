# Include inside the BloodNet HTTPS server, alongside the broader /_next/ proxy.
location ^~ /_next/static/ {
    root /var/lib/bloodnet-static;
    types {
        text/css css;
        application/javascript js mjs;
        application/json json map;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        font/otf otf;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/avif avif;
        image/gif gif;
        image/x-icon ico;
        application/wasm wasm;
    }
    disable_symlinks on from=$document_root;
    try_files $uri @bloodnet_static_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

location @bloodnet_static_missing {
    internal;
    # Clear inherited extension mappings so missing .css/.js URLs use plain text.
    types { }
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 "Static asset not found\n";
}
